services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coworker}
      POSTGRES_USER: ${POSTGRES_USER:-coworker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?SET .ENV FILE}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ai:  <- dojdzie po etapie 0.9/0.10, gdy szkielet Pythona dostanie Dockerfile

volumes:
  pgdata:
