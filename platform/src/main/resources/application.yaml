spring:
  application:
    name: platform
  config:
    import: optional:file:../.env[.properties]
  docker:
    compose:
      file: ../docker-compose.yaml
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:coworker}
    username: ${POSTGRES_USER:coworker}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: platform
  flyway:
    schemas: platform
    default-schema: platform
  threads:
    virtual:
      enabled: true #vitual thread for LongPolling telegram bot

management:
  endpoints:
    web:
      exposure:
        include: health


telegram:
  base-url: https://api.telegram.org/bot
  api-token: ${TELEGRAM_BOT_TOKEN}
  allowed-chat-id: ${TELEGRAM_ALLOWED_CHAT_ID}